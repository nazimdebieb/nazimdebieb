# Construit l'appli Android de Pop Archer à chaque changement du jeu.
# - Toujours : un APK de test (debug), à installer directement sur un téléphone.
# - Si les secrets de signature existent : l'AAB signé à envoyer sur la Play Console.
name: Pop Archer Android

on:
  push:
    paths:
      - 'pop-archer/**'
      - 'pop-archer-app/**'
      - '.github/workflows/pop-archer-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pop-archer-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pop-archer-app/package-lock.json

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - run: npm ci
      - run: npm run sync

      - name: Build debug APK
        working-directory: pop-archer-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pop-archer-debug-apk
          path: pop-archer-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release bundle
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: pop-archer-app/android
        env:
          KEYSTORE_B64: ${{ secrets.POP_ARCHER_KEYSTORE_BASE64 }}
          POP_ARCHER_KEYSTORE_PASSWORD: ${{ secrets.POP_ARCHER_KEYSTORE_PASSWORD }}
          POP_ARCHER_KEY_ALIAS: ${{ secrets.POP_ARCHER_KEY_ALIAS }}
          POP_ARCHER_KEY_PASSWORD: ${{ secrets.POP_ARCHER_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          POP_ARCHER_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('pop-archer-app/android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: pop-archer-release-aab
          path: pop-archer-app/android/app/build/outputs/bundle/release/app-release.aab
    env:
      KEYSTORE_B64: ${{ secrets.POP_ARCHER_KEYSTORE_BASE64 }}
