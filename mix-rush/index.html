<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mix Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one-screen painter's studio. A slim HUD strip on top, then one canvas
     holding the picture on its easel, the mixing bowls, and the pile of pots within
     thumb reach. The museum and dialogs are overlays. */
  :root {
    --bg: #d8e1e7;
    --bg-2: #c9d4dc;
    --panel: #f7f9fb;
    --ink: #16202a;
    --muted: #566573;
    --line: #a9b7c3;
    --accent: #d6336c;
    --accent-ink: #ffffff;
    --frame: #2f3a45;
    --canvas: #f3efe7;
    --bowl: #fbfcfd;
    --bowl-in: #d9e1e7;
    --mystery: #8995a1;
    --ice: #b9e0f6;
    --ok: #177a43;
    --warn: #a86a12;
    --bad: #c42b2b;
    --paint-r: #e5383b;
    --paint-y: #ffc300;
    --paint-b: #1f6fe0;
    --paint-o: #ff7a1a;
    --paint-g: #20a35b;
    --paint-v: #8a3fd6;
    --paint-m: #6e6158;
    --font-display: 'Bagel Fat One', 'Fredoka', system-ui, sans-serif;
    --font-ui: 'Fredoka', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121920; --bg-2: #19222b; --panel: #212b36; --ink: #edf2f6; --muted: #9eb0bf;
      --line: #394856; --accent: #f06595; --accent-ink: #1a0610; --frame: #0b1016;
      --canvas: #e9e3d7; --bowl: #dfe6ec; --bowl-in: #b3c1cd; --mystery: #6f7c89; --ice: #9fd2ef;
      --ok: #5ad17f; --warn: #f2b43c; --bad: #ff7070;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121920; --bg-2: #19222b; --panel: #212b36; --ink: #edf2f6; --muted: #9eb0bf;
    --line: #394856; --accent: #f06595; --accent-ink: #1a0610; --frame: #0b1016;
    --canvas: #e9e3d7; --bowl: #dfe6ec; --bowl-in: #b3c1cd; --mystery: #6f7c89; --ice: #9fd2ef;
    --ok: #5ad17f; --warn: #f2b43c; --bad: #ff7070;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }

  .hud {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 16px 6px;
  }
  .hud .title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.1; }
  .hud .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .hud .name { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    position: relative; flex: none;
    width: 38px; height: 38px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--panel);
    display: grid; place-items: center;
  }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn .count {
    position: absolute; top: -6px; right: -6px; min-width: 19px; height: 19px; padding: 0 5px;
    border-radius: 10px; background: var(--accent); color: var(--accent-ink);
    font-size: 12px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums;
  }
  .icon-btn[disabled] { opacity: .45; cursor: default; }
  .icon-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  #stage { position: relative; flex: 1; min-height: 0; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hint {
    position: absolute; left: 16px; right: 16px; top: 4px; z-index: 2;
    background: var(--panel); color: var(--ink); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 10px 14px; font-size: 15px; line-height: 1.35;
    box-shadow: 0 6px 20px rgb(0 0 0 / .12);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .hint b { color: var(--accent); }
  .hint .x { margin-left: auto; flex: none; border: 0; background: none; color: var(--muted); font-size: 13px; padding: 2px 4px; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; padding: 16px;
    background: rgb(10 16 22 / .55);
  }
  .dialog {
    width: min(100%, 380px); background: var(--panel); color: var(--ink);
    border-radius: 22px; padding: 22px 20px 18px; text-align: center;
    box-shadow: 0 20px 60px rgb(0 0 0 / .35);
    display: flex; flex-direction: column; gap: 12px;
  }
  .dialog h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; line-height: 1.05; text-wrap: balance; }
  .dialog p { margin: 0; color: var(--muted); line-height: 1.4; }
  .dialog canvas { align-self: center; border-radius: 10px; }
  .stars { display: flex; justify-content: center; gap: 6px; }
  .stars svg { width: 34px; height: 34px; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .btn {
    border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 600; font-size: 16px;
    background: var(--bg-2); color: var(--ink);
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn small { display: block; font-weight: 500; font-size: 12px; opacity: .8; }

  .recipes { display: grid; gap: 10px; margin: 4px 0; }
  .recipe { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 18px; }
  .recipe canvas { border-radius: 50%; }

  /* Museum = level select */
  .museum {
    position: fixed; inset: 0; z-index: 8; overflow-y: auto;
    background: var(--bg);
    padding-block: 18px 32px; padding-inline: 16px;
  }
  .museum-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .logo { font-family: var(--font-display); font-weight: 400; font-size: 48px; line-height: .95; margin: 8px 0 0; letter-spacing: .01em; }
  .logo .m { color: var(--paint-r); } .logo .i { color: var(--paint-y); } .logo .x { color: var(--paint-b); }
  .tagline { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.4; max-width: 34ch; }
  .museum h3 { margin: 6px 0 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 520px) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .frame {
    border: 0; padding: 10px 10px 8px; border-radius: 16px; background: var(--panel);
    display: flex; flex-direction: column; gap: 6px; align-items: stretch; text-align: left;
  }
  .frame canvas { width: 100%; aspect-ratio: 1; border-radius: 8px; background: var(--frame); }
  .frame .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .frame .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .frame .ttl { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frame .st { color: var(--warn); font-size: 13px; letter-spacing: 1px; }
  .frame[disabled] { opacity: .55; cursor: default; }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle { border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; font-weight: 500; }
  .toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .note { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <button class="icon-btn" id="btn-museum" aria-label="Musée et niveaux">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 14l3-4 3 3 2-2 3 3"/><path d="M8 21h8"/></svg>
    </button>
    <div class="title"><span class="eyebrow" id="lvl-num">Niveau 1</span><span class="name" id="lvl-name">Le ballon</span></div>
    <button class="icon-btn" id="btn-recipes" aria-label="Recettes des mélanges">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="5"/><circle cx="15" cy="10" r="5"/><circle cx="12" cy="15" r="5"/></svg>
    </button>
    <button class="icon-btn" id="btn-undo" aria-label="Annuler le dernier coup">
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
      <span class="count" id="undo-count">3</span>
    </button>
    <button class="icon-btn" id="btn-rinse" aria-label="Rincer un bol">
      <svg viewBox="0 0 24 24"><path d="M12 3c3 4 5 6.5 5 9a5 5 0 01-10 0c0-2.5 2-5 5-9z"/><path d="M10 13a2 2 0 002 2"/></svg>
      <span class="count" id="rinse-count">1</span>
    </button>
    <button class="icon-btn" id="btn-restart" aria-label="Recommencer le niveau">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8"/><path d="M4 4v5h5"/></svg>
    </button>
  </header>
  <div id="stage">
    <canvas id="board" aria-label="Plateau de jeu : tableau à peindre, bols de mélange et pots de peinture"></canvas>
    <div class="hint" id="hint" hidden><span id="hint-text"></span><button class="x" id="hint-close" aria-label="Fermer le conseil">OK</button></div>
  </div>
</div>

<div class="overlay" id="modal" hidden><div class="dialog" id="modal-body"></div></div>

<div class="museum" id="museum" hidden>
  <div class="museum-inner">
    <h1 class="logo"><span class="m">Mix</span> <span class="i">R</span><span class="x">ush</span></h1>
    <p class="tagline">Tu ne reçois que du rouge, du jaune et du bleu. Mélange-les dans tes bols pour peindre chaque tableau.</p>
    <h3>Le musée</h3>
    <div class="gallery" id="gallery"></div>
    <h3>Réglages</h3>
    <div class="toggles">
      <button class="toggle" id="tg-sound" aria-pressed="true">Son</button>
      <button class="toggle" id="tg-glyphs" aria-pressed="true">Symboles de couleur</button>
      <button class="toggle" id="tg-reset" aria-pressed="false">Effacer la progression</button>
    </div>
    <p class="note">Prototype de test. Les boosters sont gratuits ici ; dans le jeu final, « Rincer » après un échec serait une publicité récompensée ou un achat.</p>
  </div>
</div>

<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
